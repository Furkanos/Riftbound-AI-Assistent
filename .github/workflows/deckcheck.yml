name: Deckcheck
on:
  push:
    paths:
      - 'decks/**'
      - 'wissen/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deckcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Decklisten prüfen
        run: python tools/deckcheck.py
      - name: Ergebnisse committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ergebnis/*.csv ergebnis/*.md
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualisiere Deckcheck-Ergebnisse'
            git push
          fi
